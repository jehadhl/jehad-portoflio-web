name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portfolio-app
  CONTAINER_NAME: portfolio-app
  CONTAINER_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    outputs:
      image: ${{ steps.docker-build.outputs.image }}
      image-latest: ${{ steps.docker-build.outputs.image-latest }}

    steps:
      # ============================================
      # 1. Checkout source code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================
      # 2. Configure AWS credentials
      # ============================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. Login to Amazon ECR
      # ============================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 4. Build Docker image
      # ============================================
      - name: Build Docker image
        id: docker-build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          IMAGE_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "Building Docker image..."
          echo "Image: $IMAGE"
          
          docker build \
            --pull \
            --tag $IMAGE \
            --tag $IMAGE_LATEST \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            --label "git.actor=${{ github.actor }}" \
            .
          
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image-latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          
          echo "✅ Docker image built successfully"

      # ============================================
      # 5. Push image to ECR
      # ============================================
      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          IMAGE_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "Pushing image to ECR..."
          docker push $IMAGE
          docker push $IMAGE_LATEST
          
          echo "✅ Docker image pushed successfully"
          echo "📦 Image: $IMAGE"

      # ============================================
      # 6. Deploy to EC2
      # ============================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop_on_error: true
          
          script: |
            #!/bin/bash
            set -euo pipefail
            
            # ========== Configuration ==========
            AWS_REGION="${{ env.AWS_REGION }}"
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ github.sha }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
            
            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            
            # ========== Print Info ==========
            echo "========================================="
            echo "🚀 Starting Deployment"
            echo "========================================="
            echo "Timestamp: $(date)"
            echo "Image: $IMAGE"
            echo "Container: $CONTAINER_NAME"
            echo "Port: $CONTAINER_PORT"
            echo "Region: $AWS_REGION"
            echo "========================================="
            
            # ========== Login to ECR ==========
            echo ""
            echo "📝 Step 1: Logging in to ECR..."
            
            aws ecr get-login-password --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY
            
            echo "✅ ECR login successful"
            
            # ========== Pull Image ==========
            echo ""
            echo "📥 Step 2: Pulling Docker image..."
            
            if docker pull "$IMAGE"; then
              echo "✅ Image pulled successfully: $IMAGE"
            else
              echo "❌ Failed to pull image"
              exit 1
            fi
            
            # ========== Stop Old Container ==========
            echo ""
            echo "🛑 Step 3: Stopping old container..."
            
            if docker ps --filter "name=$CONTAINER_NAME" | grep -q $CONTAINER_NAME; then
              echo "Stopping container: $CONTAINER_NAME"
              docker stop -t 30 $CONTAINER_NAME
              echo "✅ Container stopped"
            else
              echo "ℹ️ No running container found"
            fi
            
            # ========== Remove Old Container ==========
            echo ""
            echo "🗑️ Step 4: Removing old container..."
            
            if docker ps -a --filter "name=$CONTAINER_NAME" | grep -q $CONTAINER_NAME; then
              echo "Removing container: $CONTAINER_NAME"
              docker rm $CONTAINER_NAME
              echo "✅ Container removed"
            else
              echo "ℹ️ No container to remove"
            fi
            
            # ========== Start New Container ==========
            echo ""
            echo "🌱 Step 5: Starting new container..."
            
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $CONTAINER_PORT:$CONTAINER_PORT \
              -e NODE_ENV=production \
              -e BUILD_SHA="${{ github.sha }}" \
              -e BUILD_REF="${{ github.ref }}" \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"
            
            echo "✅ Container started"
            
            # ========== Wait for Container ==========
            echo ""
            echo "⏳ Step 6: Waiting for container to be ready..."
            sleep 5
            
            # ========== Health Check ==========
            echo ""
            echo "🏥 Step 7: Health check..."
            
            for i in {1..10}; do
              if docker ps --filter "name=$CONTAINER_NAME" | grep -q "$CONTAINER_NAME"; then
                echo "✅ Container is running"
                break
              fi
              
              if [ $i -eq 10 ]; then
                echo "❌ Container failed to start after 10 attempts"
                docker logs $CONTAINER_NAME
                exit 1
              fi
              
              echo "Attempt $i/10 - waiting..."
              sleep 2
            done
            
            # ========== Show Container Info ==========
            echo ""
            echo "📋 Step 8: Container information..."
            docker ps --filter "name=$CONTAINER_NAME" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            
            # ========== Show Recent Logs ==========
            echo ""
            echo "📝 Step 9: Recent logs..."
            docker logs --tail 20 $CONTAINER_NAME || true
            
            # ========== Cleanup Old Images ==========
            echo ""
            echo "🧹 Step 10: Cleaning up old images..."
            docker image prune -f --filter "until=72h" || true
            
            # ========== Success Message ==========
            echo ""
            echo "========================================="
            echo "✅ Deployment Completed Successfully!"
            echo "========================================="
            echo "Container: $CONTAINER_NAME"
            echo "Image: $IMAGE"
            echo "Port: $CONTAINER_PORT"
            echo "Updated: $(date)"
            echo "========================================="

      # ============================================
      # 7. Health Check from GitHub Actions
      # ============================================
      - name: Health Check
        run: |
          echo "🏥 Performing health check..."
          
          DOMAIN="${{ secrets.EC2_HOST }}"
          
          echo "Testing domain: https://$DOMAIN"
          sleep 5
          
          for i in {1..5}; do
            if curl -sf --connect-timeout 5 https://$DOMAIN > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              curl -I https://$DOMAIN | head -n 5
              exit 0
            fi
            
            echo "⏳ Attempt $i/5 - waiting..."
            sleep 5
          done
          
          echo "⚠️ Health check failed (might be DNS propagation delay)"
          exit 0

      # ============================================
      # 8. Success Notification
      # ============================================
      - name: Notify Deployment Success
        if: success()
        run: |
          echo ""
          echo "========================================="
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "========================================="
          echo "🌐 Website: https://${{ secrets.EC2_HOST }}"
          echo "📦 Image: ${{ steps.docker-build.outputs.image }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Time: $(date)"
          echo "========================================="

      # ============================================
      # 9. Failure Notification
      # ============================================
      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo ""
          echo "========================================="
          echo "❌ DEPLOYMENT FAILED"
          echo "========================================="
          echo "📍 Branch: ${{ github.ref }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏰ Time: $(date)"
          echo ""
          echo "Please check the logs above for details"
          echo "========================================="
          exit 1